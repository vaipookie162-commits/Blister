<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="midnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="violetOrb" cx="55%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberReflection" cx="35%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#midnightBg)" />
  <circle cx="440" cy="320" r="340" fill="url(#violetOrb)" />
  <circle cx="290" cy="540" r="300" fill="url(#amberReflection)" />
  <!-- Acoustic wave rings -->
  <g fill="none" stroke="url(#glassRing)" stroke-width="2">
    <circle cx="400" cy="400" r="290" stroke-opacity="0.25" />
    <circle cx="400" cy="400" r="245" stroke-opacity="0.4" />
    <circle cx="400" cy="400" r="200" stroke-opacity="0.55" />
    <circle cx="400" cy="400" r="155" stroke-opacity="0.7" />
  </g>
  <!-- Velvet liquid waves -->
  <path d="M 80 510 Q 240 420 400 510 T 720 490 L 720 680 L 80 680 Z" fill="#4c1d95" fill-opacity="0.45" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2" />
  <path d="M 80 560 Q 260 640 420 540 T 720 560 L 720 700 L 80 700 Z" fill="#311068" fill-opacity="0.65" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" />
  <!-- Center vinyl / moon sphere -->
  <circle cx="400" cy="360" r="115" fill="#1e1038" stroke="#d8b4fe" stroke-width="3" />
  <circle cx="400" cy="360" r="82" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="400" cy="360" r="52" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="400" cy="360" r="24" fill="#c084fc" />
  <circle cx="362" cy="322" r="28" fill="#ffffff" fill-opacity="0.16" />
</svg>
